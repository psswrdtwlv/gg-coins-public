name: Publish GG Coins site and refresh rating

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "*/30 * * * *"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: ggcoins-pages
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build updated ranking from Google Sheets
        env:
          OUTPUT_RATING_JSON: public-site/rating.json
        run: |
          mkdir -p public-site
          python scripts/build-public-rating.py
      - name: Copy site assets
        run: |
          cp index.html style.css app.js public-site/
          cp *.png *.mp4 public-site/
          if test -f rules.pdf; then cp rules.pdf public-site/; fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public-site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
